name: Publicar actualización Tauri

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Crear release de Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Verificar que el tag coincide con la versión de la aplicación
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart("v")
          $config = Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json
          $package = Get-Content -Raw package.json | ConvertFrom-Json
          $cargoVersion = (Select-String -LiteralPath src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($tagVersion -notmatch '^\d+\.\d+\.\d+$' -or $config.version -ne $tagVersion -or $package.version -ne $tagVersion -or $cargoVersion -ne $tagVersion) {
            throw "El tag $env:GITHUB_REF_NAME y las versiones de package.json, Cargo.toml y tauri.conf.json deben coincidir en SemVer X.Y.Z."
          }

      - uses: dtolnay/rust-toolchain@stable

      - name: Compilar, firmar y publicar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: SEDAPAL GIS v__VERSION__
          releaseBody: Actualización publicada automáticamente desde GitHub Actions.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
